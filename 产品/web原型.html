<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾集 · Web 管理后台（PRD V1.2 · §5）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F3;--ink:#141414;--ink2:#55555A;--ink3:#9A9A97;
  --line:#E6E6E3;--line2:#D8D8D4;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --sans:'Noto Sans SC','PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
img{display:block}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D4D4D0;border-radius:4px}
button[disabled]{opacity:.35;cursor:not-allowed!important}

/* ============ 登录门（§5.1） ============ */
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:#EDEDEB;background-image:radial-gradient(#DDDDDA 1px,transparent 1px);background-size:22px 22px}
.login-card{width:390px;background:#fff;border:1px solid var(--line2);border-radius:18px;padding:34px 32px 26px;box-shadow:0 24px 60px rgba(0,0,0,.10)}
.lg-logo{width:52px;height:52px;background:#141414;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}
.login-card h1{font-size:20px;margin:16px 0 4px}
.lg-sub{font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.14em}
.lfield{margin:18px 0 0}
.lfield label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:7px;font-weight:600}
.demo-code{margin:14px 0 0;background:#F4F4F2;border:1px dashed var(--line2);border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--ink2)}
.demo-code b{font:600 14px var(--mono);color:#141414;letter-spacing:.2em;margin-left:4px}
.login-card .btn{margin-top:12px}
.lg-note{margin-top:16px;font-size:11px;color:var(--ink3);line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
.skip{margin-top:12px;font-size:12px;color:var(--ink3);text-decoration:underline;width:100%;text-align:center}
.skip:hover{color:#141414}

/* ============ 框架 ============ */
.shell{display:flex;height:100vh}
.side{width:212px;flex:none;background:#141414;color:#E8E8E4;display:flex;flex-direction:column;padding:16px 10px 12px;overflow-y:auto}
.s-logo{display:flex;align-items:center;gap:9px;padding:2px 10px 18px;font-weight:800;font-size:14.5px;color:#fff}
.s-logo span{width:28px;height:28px;background:#fff;color:#141414;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.s-mi{display:flex;align-items:center;gap:10px;padding:9.5px 12px;border-radius:8px;font-size:13px;color:#B8B8B4;margin-bottom:2px;text-align:left;width:100%}
.s-mi:hover{color:#fff;background:#242424}
.s-mi.on{background:#fff;color:#141414;font-weight:700}
.s-mi .cnt{margin-left:auto;font:600 10px var(--mono);background:#3A3A38;color:#fff;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.s-mi.on .cnt{background:#141414}
.s-foot{margin-top:auto;font-size:10px;color:#6E6E6A;line-height:1.9;padding:12px 12px 4px;border-top:1px solid #2A2A2A}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:54px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}
.top>b{font-size:15px;flex:1}
.top .who{font:500 11px var(--mono);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;color:var(--ink2)}
.tbtn{font-size:12px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.tbtn:hover{border-color:#141414;color:#141414}
.tbtn.dark{background:#141414;color:#fff;border-color:#141414}
.tbtn.dark:hover{background:#333}
.content{flex:1;overflow-y:auto;padding:20px 22px 46px}

/* ============ 组件 ============ */
.a-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.stat-l{font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.stat-n{font:600 26px var(--mono);margin-top:8px}
.stat-d{font-size:10.5px;color:#B0B0AC;margin-top:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.card-h>b{font-size:14px}
.card-h span{font:500 10.5px var(--mono);color:var(--ink3)}
.a-note{font-size:11.5px;color:var(--ink3);line-height:1.8}
.chart{display:flex;gap:14px;align-items:flex-end;height:200px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar b{font:500 10px var(--mono);color:var(--ink3)}
.bar i{width:100%;max-width:38px;background:#D3D3CF;border-radius:5px 5px 2px 2px;display:block}
.bar.on i{background:#141414}
.bar.on b{color:#141414;font-weight:700}
.bar>span{font:400 10px var(--mono);color:var(--ink3)}
.aq{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid #F2F2F0}
.aq:last-child{border-bottom:none}
.aq .ph{width:78px;height:58px;border-radius:8px;flex:none;object-fit:cover;filter:grayscale(1);background:#E9E9E6}
.aq-i{flex:1;min-width:0}
.aq-i b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aq-i span{font-size:11px;color:var(--ink3)}
.aq-o{display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;color:var(--ink3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9.5px 10px;border-bottom:1px solid #F2F2F0;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.ell{max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tu{display:flex;align-items:center;gap:8px}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;filter:grayscale(1);background:#E9E9E6;flex:none}
.tst{font-size:10.5px;padding:2.5px 8px;border-radius:5px;display:inline-block;white-space:nowrap}
.tst.ok{background:#F0F0EE;color:var(--ink2)}
.tst.ban{background:#141414;color:#fff}
.tst.rj{border:1px solid #141414;color:#141414}
.mono{font-family:var(--mono)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 13px;border:1px solid var(--line2);border-radius:8px;font-size:12px;color:var(--ink2);background:#fff}
.chip.on{background:#141414;color:#fff;border-color:#141414}
.emptycell{text-align:center;color:#B0B0AC;padding:26px 10px!important;font-size:12px}
.sw{width:44px;height:26px;border-radius:13px;background:#D6D6D2;position:relative;flex:none;transition:.2s;flex-shrink:0}
.sw i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#141414}
.sw.on i{transform:translateX(18px)}
.tglrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #F2F2F0}
.tglrow:last-child{border-bottom:none}
.tglrow>div{flex:1;min-width:0}
.tglrow b{font-size:13.5px;display:block}
.tglrow span{font-size:11px;color:var(--ink3)}
.warnbar{background:#F4F4F2;border:1px dashed var(--line2);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;line-height:1.6;margin-bottom:12px}
.inp{width:100%;height:40px;background:#F4F4F2;border:1px solid transparent;border-radius:10px;padding:0 12px;font-size:13.5px;font-family:var(--sans);outline:none;color:var(--ink)}
.inp:focus{border-color:#141414;background:#fff}
.ta{width:100%;background:#F4F4F2;border:1px solid transparent;border-radius:10px;padding:10px 12px;font-size:13px;font-family:var(--sans);outline:none;resize:vertical;line-height:1.7;color:var(--ink)}
.ta:focus{border-color:#141414;background:#fff}
.af{margin:0 18px 12px}
.af>label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:6px;font-weight:600}
.btn{height:40px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent}
.btn-p{background:#141414;color:#fff}.btn-p:hover{background:#333}
.btn-o{background:#fff;border-color:#141414;color:#141414}
.btn-g{background:#F0F0EE;color:#141414}
.w{width:100%}
.srow{display:flex;gap:8px;align-items:center;margin-top:12px}
.srow .inp{max-width:260px}

/* ============ 弹层 / Toast（修复：独立后台关闭事件） ============ */
.ovl{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:60;animation:fdi .15s}
.amodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,92vw);background:#fff;border-radius:14px;z-index:61;max-height:86vh;overflow-y:auto;animation:pop .18s;padding-bottom:16px}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:15px 18px 11px;border-bottom:1px solid #F0F0EE;position:sticky;top:0;background:#fff;z-index:1}
.mhd b{font-size:15px}
.ibtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#141414}
.ibtn:hover{background:#F0F0EE}
.m-info{padding:2px 18px 8px;font-size:13px;color:var(--ink2);line-height:1.9}
.m-ops{display:flex;gap:8px;padding:6px 18px 0;flex-wrap:wrap}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-14px);background:#141414;color:#fff;padding:10px 17px;border-radius:10px;font-size:13px;display:flex;gap:7px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fdi{from{opacity:0}}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.96);opacity:0}}

@media(max-width:900px){
  .side{width:60px;padding:16px 8px}
  .side .lbl,.s-logo b,.s-foot{display:none}
  .s-logo{justify-content:center;padding-left:0;padding-right:0}
  .s-mi{justify-content:center;padding:10px 0}
  .s-mi .cnt{position:absolute;transform:translate(14px,-10px)}
  .s-mi{position:relative}
}
</style>

function pgTrade(){

 ${q.length?q.map(it=>`<div class="aq">${pic(it.imgs[0],160,120)}<div class="aq-i"><b>${esc(it.title)}</b><span>${esc(it.cat)} · ¥${fmt(it.price)} · 申请人 ${esc(it.seller)}（UID ${it.uid}）· ${it.time} 提交</span></div>
  <div class="aq-o"><button class="tbtn dark" data-act="t-aprv" data-id="${it.id}">${ic('check',13)} 通过</button><button class="tbtn" data-act="t-rej" data-id="${it.id}">拒绝</button></div></div>`).join('')

 <div class="card"><div class="card-h"><b>已审核物品 · ${done.length}</b><span>审核状态与销售状态分离展示</span></div>

 ${done.length?done.map(it=>{
   const rbadge=it.review==='pass'?'<span class="tst ok">已通过</span>':'<span class="tst rj">已拒绝</span>';
   const sbadge=it.review==='pass'?(it.off?'<span class="tst ban">已下架</span>':`<span class="tst ${it.status==='on'?'ok':'ban'}">${it.status==='on'?'在售':'已售'}</span>`):'—';
   const ops=it.review==='pass'
    ?`<button class="tbtn" data-act="t-off" data-id="${it.id}">${it.off?'重新上架':'下架'}</button> <button class="tbtn" data-act="t-del" data-id="${it.id}">删除</button>`
    :`<button class="tbtn" data-act="t-del" data-id="${it.id}">删除</button>`;
   return `<tr><td class="ell">${esc(it.title)}</td><td>${esc(it.cat)}</td><td class="mono">¥${fmt(it.price)}</td><td>${esc(it.seller)}</td><td>${rbadge}</td><td>${sbadge}</td><td>${ops}</td></tr>`;
  }).join(''):'<tr><td colspan="7" class="emptycell">暂无数据</td></tr>'}</tbody></table></div>`;
}

 ${list.length?list.map(r=>`<div class="aq"><div style="width:38px;height:38px;border:1px solid var(--line2);border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none">${ic('flag',17)}</div>
  <div class="aq-i"><b>${esc(r.obj)}</b><span>原因：${esc(r.reason)}${r.desc?' · '+esc(r.desc):''} · 举报人 ${esc(r.by)} · ${esc(r.time)}${r.action?' · 处理：'+esc(r.action):''}</span></div>
  <div class="aq-o">${r.status==='todo'?`<button class="tbtn dark" data-act="rep-handle" data-id="${r.id}">处理</button>`:'<span class="tst ok">已处理</span>'}</div></div>`).join('')
 :`<p class="a-note" style="margin:6px 0 2px">${state.reportFilter==='todo'?'暂无待处理举报 ✓':'暂无已处理记录'}</p>`}</div>`;
}

function pgAd(){
 return `<div class="card"><div class="card-h"><b>广告位开关</b><span>保存后 App 端实时生效</span></div>
 ${!db.settings.ads?`<div class="warnbar">${ic('alert',15)}<span>「广告总开关」当前为关闭状态（系统设置），以下开关暂不生效。</span></div>`:''}
 ${[['tradeBnr','交易页 Banner','轮播 · 最多 5 张'],['taskBnr','任务页 Banner','任务信息流顶部'],['feed','论坛信息流广告','每 5～8 条帖子插入一条'],['detail','详情页底部广告','物品 / 帖子详情底部'],['inter','插屏广告','每用户每日 ≤ 3 次']].map(([k,t,d])=>
  `<div class="tglrow"><div><b>${t}</b><span>${d}</span></div><button class="sw ${db.adConf[k]?'on':''}" data-act="ad-toggle" data-k="${k}" data-t="${t}" title="切换"><i></i></button></div>`).join('')}
 <div class="tglrow" style="border:none"><div><b>激励视频</b><span>P1 二期 · 用户主动触发</span></div><span class="tst ok">未启用</span></div></div>
 <div class="card"><div class="card-h"><b>广告原则（§4.6.2）</b></div>
 <div class="a-note" style="margin:0">不遮挡核心按钮；不强制看广告才能联系卖家；iOS 需处理 ATT 隐私授权；国内接穿山甲 / 优量汇，海外接 AdMob；所有广告位带「广告」标识，不诱导点击。</div></div>`;
}

function pgNotice(){
 return `<div class="card"><div class="card-h"><b>发布公告</b><span>发布后送达 App「消息通知」并计未读</span></div>
 <div class="af" style="margin:6px 0 12px"><label>公告标题 *</label><input class="inp" id="no-title" placeholder="如：周末市集交通提示"></div>
 <div class="af"><label>公告内容</label><textarea class="ta" id="no-body" rows="3" placeholder="公告正文…"></textarea></div>
 <button class="tbtn dark" style="margin-left:18px" data-act="notice-submit">${ic('megaphone',13)} 发布系统公告</button></div>
 <div class="card"><div class="card-h"><b>历史公告 · ${db.noticeList.length}</b></div>
 ${db.noticeList.length?db.noticeList.map((n,i)=>`<div class="aq"><div style="width:38px;height:38px;border:1px solid var(--line2);border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none">${ic('megaphone',16)}</div>
  <div class="aq-i"><b>${esc(n.title)}</b><span>${esc(n.content)||'（无正文）'} · ${esc(n.time)}</span></div>
  <button class="tbtn" data-act="notice-del" data-i="${i}">删除</button></div>`).join(''):'<p class="a-note" style="margin:6px 0 2px">暂无公告</p>'}</div>`;
}

function pgSet(){
 const s=db.settings;
 return `<div class="card"><div class="card-h"><b>审核与广告开关</b><span>保存后 App 端实时生效</span></div>
 <div class="tglrow"><div><b>内容审核（先审后发）</b><span>关闭后新发布内容直接上架 · 正式环境不建议关闭</span></div>
  <button class="sw ${s.audit?'on':''}" data-act="set-toggle" data-k="audit" data-t="内容审核开关"><i></i></button></div>
 <div class="tglrow"><div><b>广告总开关</b><span>关闭后全部广告位停用</span></div>
  <button class="sw ${s.ads?'on':''}" data-act="set-toggle" data-k="ads" data-t="广告总开关"><i></i></button></div></div>
 <div class="card"><div class="card-h"><b>协议与联系方式</b><span>App 端「设置 / 登录页」读取此处内容</span></div>
 <div class="af" style="margin:8px 0 12px"><label>隐私政策</label><textarea class="ta" id="st-privacy" rows="3">${esc(s.privacy)}</textarea></div>
 <div class="af"><label>用户协议</label><textarea class="ta" id="st-agreement" rows="3">${esc(s.agreement)}</textarea></div>
 <div class="af"><label>管理员联系方式（展示于 App「联系管理员」）</label><input class="inp" id="st-contact" value="${esc(s.contact)}"></div>
 <button class="tbtn dark" style="margin-left:18px" data-act="set-save">${ic('check',13)} 保存设置</button></div>`;
}

function pgLogs(){
 return `<div class="card"><div class="card-h"><b>操作日志 · ${db.logs.length}</b><span>记录到具体管理员：谁 · 什么时间 · 做了什么（§5.1）</span></div>
 <table class="tbl"><thead><tr><th>时间</th><th>管理员</th><th>操作</th></tr></thead><tbody>
 ${db.logs.map(l=>`<tr><td class="mono" style="white-space:nowrap">${esc(l.t)}</td><td class="mono">${esc(l.who)}</td><td>${esc(l.act)}</td></tr>`).join('')||'<tr><td colspan="3" class="emptycell">暂无日志</td></tr>'}
 </tbody></table><p class="a-note" style="margin-top:12px">日志仅追加、不可删除，用于安全审计与操作追溯。</p></div>`;
}

const PAGES={dash:pgDash,trade:pgTrade,cat:pgCat,forum:pgForum,task:pgTask,user:pgUser,report:pgReport,ad:pgAd,notice:pgNotice,set:pgSet,logs:pgLogs};

function renderShell(){
 $('#app').innerHTML=`<div class="shell">
  <aside class="side">
   <div class="s-logo"><span>拾</span><b>拾集 · 管理后台</b></div>
   ${MENU.map(([k,l,i])=>{
     const cnt=k==='trade'?pendingCount():k==='report'?reportTodoCount():0;
     return `<button class="s-mi ${state.page===k?'on':''}" data-act="nav" data-p="${k}">${ic(i,16)}<span class="lbl">${l}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</button>`;}).join('')}
   <div class="s-foot">${esc(state.admin)} · 二次验证已通过<br>强密码策略已启用<br>全部操作写入日志</div>
  </aside>
  <div class="main">
   <div class="top"><b>${TITLES[state.page]}</b>
    <span class="who">${ic('shield',12)} ${esc(state.admin)}</span>
    <button class="tbtn" data-act="reset">${ic('clock',13)} 重置演示</button>
    <button class="tbtn" data-act="logout">${ic('logout',13)} 退出登录</button>
   </div>
   <div class="content" id="content">${PAGES[state.page]()}</div>
  </div></div>`;
}
function render(){state.logged?renderShell():renderLogin();}

/* ================= 弹窗表单 ================= */
function taskModal(t){
 t=t||{};
 return `<div class="af"><label>任务标题 *</label><input class="inp" id="t-title" value="${esc(t.title||'')}" placeholder="如：周末图书馆整理志愿者"></div>
 <div class="af"><label>任务简述</label><textarea class="ta" id="t-brief" rows="2" placeholder="一句话说明做什么">${esc(t.brief||'')}</textarea></div>
 <div class="af"><label>报酬 / 积分 / 结算说明（纯文字，平台无积分体系、不结算）</label><input class="inp" id="t-rw" value="${esc(t.reward||'')}" placeholder="如：¥100 / 线下现金日结"></div>
 <div class="af"><label>任务详情</label><textarea class="ta" id="t-desc" rows="3" placeholder="地点、时间、注意事项…">${esc(t.desc||'')}</textarea></div>
 <div class="af"><label>截止时间</label><input class="inp" id="t-dl" value="${esc(t.deadline||'')}" placeholder="如：10-30"></div>
 <div style="padding:2px 18px 0"><button class="btn btn-p w" data-act="task-save">保存并${state.editTask?'更新':'发布到 App'}</button></div>`;
}

/* ================= 事件 ================= */
const acts={
 /* 登录 */
 'login-fill':()=>{$('#lg-u').value='admin_01';$('#lg-p').value='Shiji@2026';toast('已填充演示账号','check');},
 'login-submit':()=>{
   const u=val('lg-u'),p=val('lg-p');
   if(!['admin_01','admin_02'].includes(u))return toast('账号不存在（演示账号：admin_01 / admin_02）','alert');
   if(!(p.length>=8&&/[a-zA-Z]/.test(p)&&/\d/.test(p)))return toast('强密码策略：至少 8 位且同时包含字母与数字','alert');
   state.admin=u;state.step='fa';render();},
 'login-back':()=>{state.step='pw';render();},
 'fa-submit':()=>{
   if(val('fa-c')!=='246810')return toast('动态验证码错误（演示验证码：246810）','alert');
   state.logged=true;log('登录管理后台（二次验证通过）');render();toast('欢迎，'+state.admin,'check');},
 'skip-login':()=>{state.admin='admin_01';state.logged=true;log('登录管理后台（演示直进）');render();toast('已跳过登录（演示）','eye');},
 'logout':()=>{log('退出管理后台');state.logged=false;state.step='pw';state.page='dash';render();},
 'reset':()=>{const a=state.admin,lg=state.logged;db=freshDb();state=stateInit();state.logged=lg;state.admin=a;log('重置演示数据');render();toast('演示数据已重置','check');},
 /* 框架 */
 'nav':t=>{state.page=t.dataset.p;render();},
 'close':()=>closeModal(),
 /* 交易管理 */
 't-aprv':t=>{const it=db.items.find(x=>x.id===+t.dataset.id);it.review='pass';log('通过了二手审核「'+it.title+'」');render();toast('已通过：「'+it.title+'」现已上架 App','check');},
 't-rej':t=>{const it=db.items.find(x=>x.id===+t.dataset.id);it.review='reject';log('拒绝了二手审核「'+it.title+'」');render();toast('已拒绝，用户将在「我的发布」看到结果','x');},
 't-off':t=>{const it=db.items.find(x=>x.id===+t.dataset.id);it.off=!it.off;log((it.off?'下架了':'重新上架了')+'二手物品「'+it.title+'」');render();},
 't-del':t=>{const it=db.items.find(x=>x.id===+t.dataset.id);db.items=db.items.filter(x=>x.id!==it.id);log('删除了二手物品「'+it.title+'」');render();toast('已删除','trash');},
 /* 分类管理 */
 'cat-add':()=>{const c=val('cat-new');if(!c)return toast('请输入分类名称','alert');if(db.cats.includes(c))return toast('分类已存在','alert');
   db.cats.push(c);log('新增了分类「'+c+'」');render();toast('分类「'+c+'」已添加，App 宫格同步','check');},
 'cat-up':t=>{const i=+t.dataset.i;[db.cats[i-1],db.cats[i]]=[db.cats[i],db.cats[i-1]];log('调整了分类排序');render();},
 'cat-down':t=>{const i=+t.dataset.i;[db.cats[i+1],db.cats[i]]=[db.cats[i],db.cats[i+1]];log('调整了分类排序');render();},
 'cat-del':t=>{
   const c=t.dataset.c;
   if(db.cats.length<=1)return toast('至少保留 1 个分类，无法删除','alert');
   const rest=db.cats.filter(x=>x!==c);
   const target=rest.includes('其他')?'其他':rest[0];
   const n=db.items.filter(x=>x.cat===c&&x.review==='pass'&&!x.off&&x.status==='on').length;
   state.pendingCat=c;state.catTarget=target;
   if(n>0){openModal('删除分类「'+esc(c)+'」？',`<p class="m-info">该分类下仍有 <b>${n} 件在售物品</b>，删除后这些物品将归入「${esc(target)}」分类。（§5.3.3 二次确认）</p>
     <div class="m-ops"><button class="tbtn" data-act="close">取消</button><button class="tbtn dark" data-act="cat-del-ok">仍要删除</button></div>`);}
   else acts['cat-del-ok']();},
 'cat-del-ok':()=>{
   const c=state.pendingCat,target=state.catTarget;if(!c)return;
   const n=db.items.filter(x=>x.cat===c).length;
   db.cats=db.cats.filter(x=>x!==c);
   db.items.forEach(x=>{if(x.cat===c)x.cat=target;});
   log('删除了分类「'+c+'」，'+n+' 件物品归入「'+target+'」');
   state.pendingCat=null;closeModal();render();toast('分类已删除，相关物品已归入「'+target+'」','trash');},
 /* 论坛管理 */
 'f-aprv':t=>{const p=db.pendingPosts.find(x=>x.id===+t.dataset.id);db.pendingPosts=db.pendingPosts.filter(x=>x.id!==p.id);
   db.posts.push({id:p.id,pin:false,admin:false,user:p.user,av:p.av,time:p.time,text:p.text,likes:0,cmtsN:0});
   log('通过了帖子审核「'+p.text.slice(0,12)+'…」');render();toast('已通过，帖子已发布到 App 信息流','check');},
 'f-rej':t=>{const p=db.pendingPosts.find(x=>x.id===+t.dataset.id);db.pendingPosts=db.pendingPosts.filter(x=>x.id!==p.id);
   log('拒绝了帖子审核「'+p.text.slice(0,12)+'…」');render();toast('已拒绝','x');},
 'f-pin':t=>{const p=db.posts.find(x=>x.id===+t.dataset.id);p.pin=!p.pin;log((p.pin?'置顶了':'取消置顶了')+'帖子「'+p.text.slice(0,12)+'…」');render();},
 'f-del':t=>{const p=db.posts.find(x=>x.id===+t.dataset.id);db.posts=db.posts.filter(x=>x.id!==p.id);log('删除了帖子「'+p.text.slice(0,12)+'…」');render();toast('已删除','trash');},
 'mute':()=>{const n=val('mute-name');if(!n)return toast('请输入用户昵称','alert');
   db.mutes.unshift({name:n,by:state.admin,left:'7 天'});log('禁言了用户「'+n+'」（7 天）');render();toast('已禁言「'+n+'」7 天','ban');},
 /* 任务管理 */
 'task-new':()=>{state.editTask=null;openModal('发布任务',taskModal());},
 'task-edit':t=>{state.editTask=+t.dataset.id;openModal('编辑任务',taskModal(db.tasks.find(x=>x.id===state.editTask)));},
 'task-save':()=>{
   const title=val('t-title');if(!title)return toast('请填写任务标题','alert');
   const data={title,brief:val('t-brief')||'（详见任务页说明）',reward:val('t-rw')||'面议',deadline:val('t-dl')||'长期',desc:val('t-desc')||val('t-brief')||'详见任务页，请联系管理员沟通。'};
   if(state.editTask){const k=db.tasks.find(x=>x.id===state.editTask);Object.assign(k,data);log('编辑了任务「'+title+'」');toast('任务已更新','check');}
   else{db.tasks.unshift({id:nextId++,imgs:[],pub:nowTs().slice(0,5),off:false,...data});log('发布了任务「'+title+'」');toast('任务已发布，App 任务页立即可见','check');}
   state.editTask=null;closeModal();render();},
 'task-off':t=>{const k=db.tasks.find(x=>x.id===+t.dataset.id);k.off=!k.off;log((k.off?'下架了':'上架了')+'任务「'+k.title+'」');render();},
 'task-del':t=>{const k=db.tasks.find(x=>x.id===+t.dataset.id);db.tasks=db.tasks.filter(x=>x.id!==k.id);log('删除了任务「'+k.title+'」');render();toast('已删除','trash');},
 /* 用户管理 */
 'u-search':()=>{state.userFilter=val('u-search');render();},
 'u-clear':()=>{state.userFilter='';render();},
 'u-ban':t=>{const u=db.users.find(x=>x.uid===+t.dataset.id);u.st='banned';log('封禁了用户「'+u.name+'」');render();toast('已封禁「'+u.name+'」，其将无法登录与发布','ban');},
 'u-unban':t=>{const u=db.users.find(x=>x.uid===+t.dataset.id);u.st='ok';log('解封了用户「'+u.name+'」');render();toast('已解封「'+u.name+'」','check');},
 /* 举报管理 */
 'rep-filter':t=>{state.reportFilter=t.dataset.f;render();},
 'rep-handle':t=>{
   const r=db.reports.find(x=>x.id===+t.dataset.id);
   openModal('处理举报',`<p class="m-info">对象：${esc(r.obj)}<br>原因：${esc(r.reason)}${r.desc?' · '+esc(r.desc):''}<br>举报人：${esc(r.by)} · ${esc(r.time)}</p>
   <div class="m-ops">
    <button class="tbtn dark" data-act="rep-do" data-id="${r.id}" data-a="删除内容">${ic('trash',13)} 删除内容</button>
    <button class="tbtn" data-act="rep-do" data-id="${r.id}" data-a="封禁对方">${ic('ban',13)} 封禁对方</button>
    <button class="tbtn" data-act="rep-do" data-id="${r.id}" data-a="驳回举报">驳回举报</button>
   </div>`);},
 'rep-do':t=>{
   const r=db.reports.find(x=>x.id===+t.dataset.id);r.status='done';r.action=t.dataset.a;
   log('处理了举报「'+r.obj+'」（'+t.dataset.a+'）并通知举报人');
   closeModal();render();toast('已处理（'+t.dataset.a+'），结果将通知举报人','check');},
 /* 广告管理 */
 'ad-toggle':t=>{const k=t.dataset.k;db.adConf[k]=!db.adConf[k];log('调整了广告位开关：'+t.dataset.t+' → '+(db.adConf[k]?'开启':'关闭'));render();toast('已保存，「'+t.dataset.t+'」App 端实时生效','check');},
 /* 公告管理 */
 'notice-submit':()=>{const t=val('no-title');if(!t)return toast('请填写公告标题','alert');
   const b=val('no-body');db.noticeList.unshift({title:t,content:b,time:nowTs()});
   log('发布了系统公告「'+t+'」');render();toast('公告已发布，App「消息通知」将送达并计未读','check');},
 'notice-del':t=>{const i=+t.dataset.i;const n=db.noticeList[i];db.noticeList.splice(i,1);log('删除了系统公告「'+n.title+'」');render();toast('已删除','trash');},
 /* 系统设置 */
 'set-toggle':t=>{const k=t.dataset.k;db.settings[k]=!db.settings[k];log('更新了系统设置：'+t.dataset.t+' → '+(db.settings[k]?'开启':'关闭'));render();toast('已保存，「'+t.dataset.t+'」生效','check');},
 'set-save':()=>{
   db.settings.privacy=val('st-privacy');db.settings.agreement=val('st-agreement');db.settings.contact=val('st-contact');
   log('更新了系统设置（隐私政策 / 用户协议 / 联系方式）');render();toast('设置已保存，App 端读取最新内容','check');},
};

/* ================= 绑定 ================= */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act;
 if(acts[a]){e.preventDefault();acts[a](t,e);}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return;}
 if(e.key!=='Enter')return;
 const map={'lg-u':'login-submit','lg-p':'login-submit','fa-c':'fa-submit','u-search':'u-search','cat-new':'cat-add','mute-name':'mute'};
 const a=map[e.target.id];
 if(a){e.preventDefault();acts[a]();}
});

render();
</script>
</body>
</html>
